[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dicom-catalog"
version = "0.1.0"
description = "Catalog DICOM imaging data into PostgreSQL using an XNAT-style project/subject/session/scan hierarchy"
requires-python = ">=3.10"
dependencies = ["pydicom>=3.0", "psycopg[binary]>=3.1", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dicom-catalog = "dicom_catalog.cli:main"

[tool.setuptools.package-data]
dicom_catalog = ["schema.sql"]
